    permissions:
      id-token: write
      contents: read
    needs: [ save-amd64-result ]
    if: ${{ always() }}
    uses: apecloud-inc/apecloud-cd/.github/workflows/feishui-message.yml@v0.1.0
    with:
      TYPE: "2"
      CONTENT: "save image ${{ needs.save-amd64-result.outputs.image-pkg-name }} ${{ needs.save-amd64-result.outputs.save-result }}"
    secrets: inherit

