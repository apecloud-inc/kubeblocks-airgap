  save-amd64-result:
    name: save result (amd64)
    runs-on: ubuntu-latest
    needs: [ save-amd64-images ]
    if: ${{ always() }}
    permissions:
      contents: read
    outputs:
      image-pkg-name: ${{ steps.get_save_result.outputs.image_pkg_name }}
      save-result: ${{ steps.get_save_result.outputs.save_result }}
    steps:
      - name: get amd64 save result
        id: get_save_result
        env:
          RAW_FILE_NAME: ${{ inputs.FILE_NAME }}
          RAW_APP_VERSION: ${{ inputs.APP_VERSION }}
          AMD64_RESULT: ${{ needs.save-amd64-images.result }}
          AMD64_PKG: ${{ needs.save-amd64-images.outputs.image-pkg-name }}
        run: |
          FILE_NAME="${RAW_FILE_NAME#"${RAW_FILE_NAME%%[![:space:]]*}"}"
          FILE_NAME="${FILE_NAME%"${FILE_NAME##*[![:space:]]}"}"
          FILE_NAME="${FILE_NAME%.txt}"
          APP_VERSION="${RAW_APP_VERSION#"${RAW_APP_VERSION%%[![:space:]]*}"}"
          APP_VERSION="${APP_VERSION%"${APP_VERSION##*[![:space:]]}"}"

          SAVE_RESULT="error"
          IMAGE_PKG_NAME="${AMD64_PKG:-${FILE_NAME}-${APP_VERSION}.tar.gz}"
          if [[ "${AMD64_RESULT}" == "success" ]]; then
              SAVE_RESULT="success"
              IMAGE_PKG_NAME="http://${OSS_BUCKET}.${OSS_ENDPOINT}/${OSS_DIR_AMD64}/${IMAGE_PKG_NAME}"
          fi
          echo "save_result=${SAVE_RESULT}" >> "$GITHUB_OUTPUT"
          echo "image_pkg_name=${IMAGE_PKG_NAME}" >> "$GITHUB_OUTPUT"

  send-amd64-message:
